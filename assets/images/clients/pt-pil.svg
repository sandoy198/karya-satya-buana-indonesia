    <path d="M 0,-44 A 44,44 0 0,1 44,0 C 44,18 32,32 16,40 C 26,30 32,18 32,0 A 32,32 0 0,0 0,-32 C -18,-32 -32,-18 -32,0 C -32,10 -26,18 -18,24 C -28,18 -36,8 -36,-4 A 40,40 0 0,1 0,-44 Z" fill="url(#pilDarkGrad)" />
    
    <!-- Dynamic inner cyan/blue wave -->
