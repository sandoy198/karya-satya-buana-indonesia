  <!-- Text -->
  <text x="120" y="132" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="900" fill="#0A192F" text-anchor="middle" letter-spacing="2">PT. PIL</text>
  <text x="120" y="152" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#556987" text-anchor="middle" letter-spacing="1">PENGEMBANGAN INDUSTRI LOGAM</text>
</svg>