    <!-- Core swirl tail -->
    <path d="M -4,2 C 4,2 10,-4 10,-10 C 10,-14 6,-18 0,-18 C -6,-18 -10,-14 -10,-8 C -10,-2 -4,2 -4,2 Z" fill="#0288D1" opacity="0.9" />
