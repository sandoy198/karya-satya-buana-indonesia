<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sedang Dalam Pemeliharaan &mdash; PT Karya Satya Buana Indonesia</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-blue: #0b2859;
      --brand-red: #c91823;
      --text-main: #0f172a;
      --text-muted: #475569;
      --bg-subtle: #f8fafc;
      --border: #e2e8f0;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(160deg, #ffffff 0%, var(--bg-subtle) 100%);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 520px;
      padding: 40px 28px;
      text-align: center;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
    }

    .logo {
      width: 96px;
      height: auto;
      margin: 0 auto 28px;
      display: block;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      margin-bottom: 20px;
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--brand-red);
      background: #fdf2f2;
      border-radius: 9999px;
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand-red);
    }

    h1 {
      margin: 0 0 14px;
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(1.5rem, 5vw, 1.875rem);
      font-weight: 700;
      line-height: 1.25;
      color: var(--brand-blue);
      text-wrap: balance;
    }

    p {
      margin: 0;
      font-size: 1rem;
      line-height: 1.7;
      color: var(--text-muted);
    }

    .divider {
      height: 1px;
      margin: 28px 0 20px;
      background: var(--border);
      border: 0;
    }

    .company {
      font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--brand-blue);
    }

    @media (min-width: 640px) {
      .card { padding: 56px 48px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/assets/images/logo.png" alt="Logo PT Karya Satya Buana Indonesia" width="96">
    <span class="badge">Pemeliharaan Terjadwal</span>
    <h1>Situs Sedang Dalam Pemeliharaan</h1>
    <p>Kami sedang melakukan pembaruan pada situs ini. Silakan kembali beberapa saat lagi.</p>
    <hr class="divider">
    <p class="company">PT Karya Satya Buana Indonesia</p>
  </main>
</body>
</html>
